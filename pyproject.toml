[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "contribpolicy"
version = "0.1.0"
description = "Find a repository's rules for AI-assisted contributions (disclosure, trailers, human-only replies, labels, DCO...) and lint a draft PR against them. Deterministic, no API key."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pujitha Paladugu" }]
keywords = ["ai-policy", "contributing", "pull-request", "lint", "coding-agents", "open-source", "dco", "agents-md"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pujitha24/contribpolicy"
Issues = "https://github.com/pujitha24/contribpolicy/issues"

[project.scripts]
contribpolicy = "contribpolicy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/contribpolicy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "requirements-dev.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: hits the real GitHub API (run with CONTRIBPOLICY_LIVE=1)"]

[tool.coverage.run]
source = ["contribpolicy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM102", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# The extractor is mostly a table of regular expressions; wrapping them hurts readability.
"src/contribpolicy/extract.py" = ["E501"]
"tests/*" = ["E501", "RUF012"]
