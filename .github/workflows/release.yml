# Publishes contribpolicy to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing (OpenID Connect): there is no API token anywhere. PyPI trusts this workflow
# file, in this repository, running in the `pypi` environment. One-time setup and the release steps are in
# docs/RELEASING.md.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    # The same lint and test jobs as on every push and pull request.
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install the build tools (pinned by hash)
        run: python -m pip install --require-hashes -r requirements-release.txt
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import sys; sys.path.insert(0, "src"); from contribpolicy._meta import VERSION; print(VERSION)')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag '$TAG' does not match the package version 'v$version' in src/contribpolicy/_meta.py."
            exit 1
          fi
      - name: Build the sdist and the wheel
        run: python -m build --no-isolation
      - name: Smoke-test the wheel
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/smoke/bin/contribpolicy" --version
          "$RUNNER_TEMP/smoke/bin/contribpolicy" show tests/fixtures/k8s_style --offline --format json > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/contribpolicy/
    permissions:
      id-token: write # Trusted Publishing: lets the job request a short-lived OIDC token for PyPI
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Checks the metadata with twine, uploads, and publishes digital attestations (PEP 740).
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
